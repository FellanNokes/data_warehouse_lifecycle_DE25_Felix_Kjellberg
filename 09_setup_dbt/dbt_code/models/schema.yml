version: 2

models:
    - name: dim_occupation
      columns:
        - name: occupation_id
          data_tests:
            - unique
            - not_null

    - name: dim_job_details
      columns:
        - name: job_details_id
          data_tests:
            - unique
            - not_null

    - name: dim_employer
      columns:
        - name: employer_id
          data_tests:
            - unique
            - not_null

    - name: dim_auxilliary_attributes
      columns:
        - name: auxilliary_attributes_id
          data_tests:
            - unique
            - not_null

    - name: fct_job_ads
      columns:
        - name: job_id
          data_tests:
            - unique
            - not_null
        - name: occupation_id
          data_tests:
            - relationships:
                to: ref('dim_occupation')
                field: occupation_id
        - name: job_details_id
          data_tests:
            - relationships:
                to: ref('dim_job_details')
                field: job_details_id
        - name: employer_id
          data_tests:
            - relationships:
                to: ref('dim_employer')
                field: employer_id
        - name: auxilliary_attributes_id
          data_tests:
            - relationships:
                to: ref('dim_auxilliary_attributes')
                field: auxilliary_attributes_id
